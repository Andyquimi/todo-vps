# /etc/nginx/sites-available/todo-app
# Habilitar con: sudo ln -s /etc/nginx/sites-available/todo-app /etc/nginx/sites-enabled/
# Luego: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name _;   # Reemplazar por tu dominio si tienes uno, o dejar _ para IP directa

    # Redirige todo hacia la app Node (que sirve API + frontend estático)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cabeceras básicas de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# --- Nota para HTTPS con dominio propio ---
# sudo apt install certbot python3-certbot-nginx
# sudo certbot --nginx -d tu-dominio.com
# Certbot reescribe este bloque automáticamente para servir en 443 con TLS.
