version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: todo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: cambia_esta_clave
      POSTGRES_DB: todo_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - todo-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: todo-backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: todo_user
      DB_PASSWORD: cambia_esta_clave
      DB_NAME: todo_db
    networks:
      - todo-network

  nginx:
    image: nginx:alpine
    container_name: todo-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge

volumes:
  postgres_data: