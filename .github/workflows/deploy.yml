- name: Sincronizar archivos al VPS (rsync)
        run: |
          set +e
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.github' \
            -e "ssh -i ~/.ssh/id_rsa" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/todo-app/
          rc=$?
          set -e
          if [ $rc -ne 0 ] && [ $rc -ne 24 ]; then
            echo "rsync fallo con codigo real de error: $rc"
            exit $rc
          fi
          echo "rsync completado (codigo $rc, 24 es aceptable)"
