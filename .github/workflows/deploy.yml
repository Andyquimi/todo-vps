name: Deploy To-Do App a VPS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del backend
        working-directory: ./backend
        run: npm install --omit=dev

      - name: Ejecutar pruebas (si existen)
        working-directory: ./backend
        run: npm test --if-present

      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sincronizar archivos al VPS (rsync)
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.github' \
            -e "ssh -i ~/.ssh/id_rsa" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/todo-app/

      - name: Instalar dependencias en el VPS y reiniciar el servicio
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            set -e
            cd /var/www/todo-app/backend
            npm install --omit=dev
            sudo systemctl restart todo-api
            sleep 2
            curl -f http://127.0.0.1:3000/api/health
          '

      - name: Notificar resultado
        if: always()
        run: echo "Despliegue finalizado con estado ${{ job.status }}"
